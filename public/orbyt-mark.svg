<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Orbyt mark">
  <defs>
    <radialGradient id="orbytPlanet" cx="36%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#FFD9A8"/>
      <stop offset="38%" stop-color="#FFB25C"/>
      <stop offset="72%" stop-color="#FF7A1A"/>
      <stop offset="100%" stop-color="#B34200"/>
    </radialGradient>
  </defs>

  <!-- full orbit ring (behind planet) -->
  <g transform="rotate(-18 32 32)">
    <ellipse cx="32" cy="32" rx="30" ry="12" stroke="currentColor" stroke-opacity="0.5" stroke-width="2.5"/>
    <!-- satellite on ring, upper right -->
    <circle cx="59.2" cy="26.9" r="3" fill="currentColor"/>
  </g>

  <!-- planet -->
  <circle cx="32" cy="32" r="13" fill="url(#orbytPlanet)"/>
  <ellipse cx="27.5" cy="26.5" rx="4.6" ry="2.6" transform="rotate(-28 27.5 26.5)" fill="#FFF6E8" opacity="0.45"/>

  <!-- front arc of ring (in front of planet) -->
  <g transform="rotate(-18 32 32)">
    <path d="M 2 32 A 30 12 0 0 1 62 32" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
